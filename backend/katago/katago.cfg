# KataGo 配置（CPU / Eigen 后端）
# 该配置同时用于 GTP 对弈与 Analysis 分析。
# 难度（maxVisits）会在运行时通过 kata-set-param 或查询参数动态覆盖。

# 搜索量：1=近乎随机，100=业余初段，1000+=高段
maxVisits = 100

# CPU 搜索线程数（按机器核心数调整，2核服务器建议 2）
numSearchThreads = 4

# 关闭思考（对手落子时不预搜索），节省 CPU
ponderingEnabled = false

# 认输阈值（胜率低于此值认输）
resignThreshold = -0.90
allowResignation = true

# 规则
rules = chinese
