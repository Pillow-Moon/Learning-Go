# ============================================================
# KataGo Analysis 分析配置（OpenCL GPU 加速）
# ============================================================

# ----- 后端 -----
openclDeviceToUse = 0

# ----- 日志 -----
logSearchInfo = false
logToStderr = false
logTimestamps = false

# ----- 规则 -----
rules = chinese

# ----- 分析搜索限制 -----
maxVisits = 100
reportAnalysisWinratesAs = BLACK
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# ----- 神经网络缓存 -----
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
