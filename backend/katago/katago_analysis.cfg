# ============================================================
# KataGo Analysis 分析配置（v1.17.0，CPU Eigen 后端）
# 用于局面分析（候选选点/胜率/变化图），是 AI 解说的数据源。
# 注意：analysis 模式不能与 GTP 的 numSearchThreads 共存于同一配置。
# ============================================================

# ----- 日志 -----
logSearchInfo = false
logToStderr = false
logTimestamps = false

# ----- 规则 -----
rules = chinese

# ----- 分析搜索限制 -----
maxVisits = 100
reportAnalysisWinratesAs = BLACK
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# ----- 神经网络缓存 -----
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
