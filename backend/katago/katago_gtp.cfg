# ============================================================
# KataGo GTP 对弈配置（v1.17.0，CPU Eigen 后端）
# 难度（maxVisits）会在运行时由后端通过 kata-set-param 动态覆盖。
# ============================================================

# ----- 日志 -----
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false
logTimestamps = false

# ----- 规则 -----
rules = chinese

# ----- 搜索限制 -----
# 1=近乎随机，100=业余初段，1000+=高段（运行时可覆盖）
maxVisits = 100
numSearchThreads = 4
maxTime = 10

# ----- 认输 -----
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3

# ----- 思考（关闭以节省 CPU）-----
ponderingEnabled = false

# ----- 其他 -----
reuseSubtree = true
clearCacheAfterBoardResize = true
