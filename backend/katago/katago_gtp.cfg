# ============================================================
# KataGo GTP 对弈配置（OpenCL GPU 加速）
# ============================================================

# ----- 后端 -----
# OpenCL 使用显卡驱动自带的运行时，无需额外安装 CUDA Toolkit
openclDeviceToUse = 0

# ----- 日志 -----
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false
logTimestamps = false

# ----- 规则 -----
rules = chinese

# ----- 搜索限制 -----
numSearchThreads = 4
maxVisits = 100
maxTime = 10

# ----- 认输 -----
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3

# ----- 思考 -----
ponderingEnabled = false

# ----- 其他 -----
reuseSubtree = true
clearCacheAfterBoardResize = true
