name: Build Backend EXE (绿色包)

# 手动触发（workflow_dispatch）或推送 tag（v*）时构建
# 产物：WeiQiAI-Engine-win64.zip（绿色免安装，模型内置，约 400~450MB）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # 允许创建/更新 Release（tag 触发时发布绿色包）

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download KataGo binary (opencl)
        shell: pwsh
        run: |
          $zip = "$env:TEMP\katago-opencl.zip"
          try {
            Invoke-WebRequest -Uri "https://github.com/lightvector/KataGo/releases/download/v1.17.0/katago-v1.17.0-opencl-windows-x64.zip" -OutFile $zip -UseBasicParsing
          } catch {
            # 资产名变更时回退 eigenavx2（CPU 版，功能一致、稍慢）
            Invoke-WebRequest -Uri "https://github.com/lightvector/KataGo/releases/download/v1.17.0/katago-v1.17.0-eigenavx2-windows-x64.zip" -OutFile $zip -UseBasicParsing
          }
          Expand-Archive $zip -DestinationPath "$env:TEMP\katago-extract" -Force
          Get-ChildItem "$env:TEMP\katago-extract" -Recurse -Filter katago.exe | Select-Object -First 1 | ForEach-Object {
            Move-Item $_.FullName "backend\katago\katago.exe" -Force
          }
          Get-Item backend\katago\katago.exe | Select-Object Name, Length

      - name: Download models (b11c768h12 + humanv0)
        shell: pwsh
        run: |
          # checkout 后目录不存在（.gitignore 排除了 backend/katago/*），需先创建
          New-Item -ItemType Directory -Force "backend\katago\models" | Out-Null
          $models = @(
            @{ url = "https://github.com/lightvector/KataGo/releases/download/v1.17.0/b11c768h12nbt3tflrs-fson-silu.bin.gz"; out = "backend\katago\models\b11c768h12.bin.gz" },
            @{ url = "https://github.com/lightvector/KataGo/releases/download/v1.15.0/b18c384nbt-humanv0.bin.gz"; out = "backend\katago\models\b18c384nbt-humanv0.bin.gz" }
          )
          foreach ($m in $models) {
            # 大文件（约 200~400MB）下载易因网络波动中断：curl 重试 + 大小校验
            $ok = $false
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              if (Test-Path $m.out) { Remove-Item $m.out -Force }
              curl.exe -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 -o $m.out $m.url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $m.out) -and (Get-Item $m.out).Length -gt 1MB) {
                $ok = $true
              } else {
                Write-Host "模型下载失败，重试 $i/3: $($m.out)"
                Start-Sleep -Seconds 10
              }
            }
            if (-not $ok) { throw "模型下载失败: $($m.out)" }
            Write-Host "已下载 $(Get-Item $m.out).Length bytes -> $($m.out)"
          }
          Get-ChildItem backend\katago\models | Select-Object Name, Length

      - name: Build with PyInstaller (onedir)
        working-directory: backend
        run: |
          python -m PyInstaller build_exe.spec --distpath ../dist --workpath build --clean
          Get-ChildItem ../dist/WeiQiAI-Engine | Select-Object Name

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WeiQiAI-Engine -DestinationPath WeiQiAI-Engine-win64.zip -Force
          Get-Item WeiQiAI-Engine-win64.zip | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeiQiAI-Engine-win64
          path: WeiQiAI-Engine-win64.zip

      - name: Attach to Release (tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WeiQiAI-Engine-win64.zip
