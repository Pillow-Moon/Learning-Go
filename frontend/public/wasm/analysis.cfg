# ============================================================
# KataGo 分析配置（WebAssembly Eigen CPU 后端）
# ============================================================
# 基于 toyoshi/katago-wasm 官方验证过的参数（WASM 内存受限），
# 去掉其 9x9 诊断限制，恢复业务配置。

# ----- 日志 -----
logSearchInfo = false
logToStderr = true

# ----- 分析搜索限制 -----
maxVisits = 100
reportAnalysisWinratesAs = BLACK

# ----- 搜索线程（WASM 单线程最优）-----
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 1
numNNServerThreadsPerModel = 1
numEigenThreadsPerModel = 1

# ----- 神经网络缓存（WASM 内存受限，保持官方值）-----
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 14
