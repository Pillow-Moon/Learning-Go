# ============================================================
# KataGo 分析配置（WebAssembly Eigen CPU 后端）
# ============================================================

# ----- 后端 -----
# WASM 环境使用 Eigen CPU，不涉及 OpenCL/CUDA
# 不需要 openclDeviceToUse 或 cudaDeviceToUse 配置

# ----- 日志 -----
logSearchInfo = false
logToStderr = false
logTimestamps = false

# ----- 规则 -----
rules = chinese

# ----- 分析搜索限制 -----
maxVisits = 100
reportAnalysisWinratesAs = BLACK
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# ----- 神经网络缓存 -----
nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
